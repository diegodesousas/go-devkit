name: Continuous Integration
on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  continuous-integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Setup Golang
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: false

      - name: Checkout
        uses: actions/checkout@v3

      - name: Test
        run: go test -race -tags=integration ./... -covermode=atomic -coverprofile go_devkit-tests.out
