name: Lint
on:
  push:
    branches:
      - main
      - release*
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v4
        with:
          go-version: '1.26'
          cache: false

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          only-new-issues: true
          args: --timeout=5m

